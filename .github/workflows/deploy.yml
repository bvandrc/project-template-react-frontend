name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

# Required by actions/deploy-pages. Without `pages: write` + `id-token: write`
# the deploy step gets a read-only token and fails with a 403.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress deploy: let it finish so the site is never left
# half-published, and queue anything that lands while it runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint & Type Check
        run: pnpm run check

      - name: Build project
        run: pnpm build

      - name: Upload production-ready build files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
